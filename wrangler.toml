name = "cte-compound"
main = "src/worker.js"
compatibility_date = "2026-07-31"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[ai]
binding = "AI"

[version_metadata]
binding = "CF_VERSION_METADATA"

[[services]]
binding = "OANDA_ENGINE"
service = "oanda-28pair-strategy"

[[durable_objects.bindings]]
name = "HTL_ENGINE"
class_name = "HtlEngine"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "HtlEngine" ]

[triggers]
crons = [ "* * * * *" ]

[secrets]
required = [ "OANDA_ACCOUNT_ID", "OANDA_API_KEY" ]
