name: Run registered Horizon live replay

on:
  push:
    branches:
      - repair/registered-horizon-analytical-certification
    paths:
      - .github/workflows/run-registered-horizon-live-replay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registered-horizon-live-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/registered-horizon-analytical-certification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require read-only OANDA credential
        run: test -n "$OANDA_API_KEY" || { echo "OANDA_API_KEY repository secret is not configured"; exit 1; }
      - name: Install and hydrate checksum-verified source
        run: npm ci
      - name: Replay all 168 registered gross-performance rows
        run: npm run certify:horizon-live
