name: Materialize AGE policy

on:
  push:
    branches:
      - feature/age-administrating-great-expectations

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/age-administrating-great-expectations
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply AGE migration
        run: |
          if grep -q 'AGE_ADMINISTRATING_GREAT_EXPECTATIONS@1.0.0' src/engine-certified-execution.js; then
            echo 'AGE runtime already materialized.'
          else
            node scripts/migrate-age-weekend-engagement.mjs
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify AGE policy
        run: node scripts/test-age-policy.mjs
      - name: Commit materialized runtime
        run: |
          if git diff --quiet src/engine-certified-execution.js src/engine-nemotron-base.js public/index.html; then
            echo 'No AGE runtime diff.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine-certified-execution.js src/engine-nemotron-base.js public/index.html
          git commit -m "feat: establish AGE engagement and Nashville weekend flat policy"
          git push origin HEAD:feature/age-administrating-great-expectations
