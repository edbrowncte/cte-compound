name: Apply MAS v2 ROC correction

on:
  push:
    branches:
      - feature/mas-antagonist-pressure-v2
    paths:
      - scripts/fix-mas-v2-roc.py
      - .github/workflows/mas-v2-roc-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mas-antagonist-pressure-v2
          fetch-depth: 0
      - name: Correct ROC implementation
        run: python3 scripts/fix-mas-v2-roc.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mas-im-calculator.js
          git commit -m "fix: calculate MAS IM acceleration over the five-observation window"
          git push origin HEAD:feature/mas-antagonist-pressure-v2
