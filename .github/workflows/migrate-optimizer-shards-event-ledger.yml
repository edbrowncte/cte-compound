name: Migrate optimizer shards and event ledger

on:
  push:
    branches:
      - repair/optimizer-shards-event-ledger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: repair/optimizer-shards-event-ledger
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply migration
        run: |
          if grep -q 'RUNTIME_OPTIMIZER_STORAGE_PREFIX' src/optimized-optimizer.js; then
            echo "Migration already applied."
          else
            node scripts/migrate-optimizer-shards-event-ledger.mjs
          fi
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler types
        run: npx wrangler types
      - name: Verify repository
        run: npm run check
      - name: Commit migrated runtime
        run: |
          if git diff --quiet src/optimized-optimizer.js src/engine-certified-execution.js public/index.html; then
            echo "No migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/optimized-optimizer.js src/engine-certified-execution.js public/index.html
          git commit -m "fix: shard optimizer storage and populate event outcomes"
          git push origin HEAD:repair/optimizer-shards-event-ledger
