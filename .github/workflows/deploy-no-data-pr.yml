name: Deploy no-data repair through verified PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  deploy:
    if: github.head_ref == 'deploy/no-data-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/no-data-repair
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install
      - name: Verify source
        id: check
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run check
      - name: Deploy cte-compound
        id: deploy
        if: steps.install.outcome == 'success' && steps.check.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Record all outcomes
        if: always()
        run: |
          printf '{"worker":"cte-compound","source":"%s","install":"%s","check":"%s","deploy":"%s","attempted_at":"%s"}\n' "$(git rev-parse HEAD)" "${{ steps.install.outcome }}" "${{ steps.check.outcome }}" "${{ steps.deploy.outcome }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deployment-receipt.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-receipt.json
          git commit -m "deployment: record verified Cloudflare outcome"
          git push origin HEAD:deploy/no-data-repair
      - name: Enforce successful publication
        if: always() && (steps.install.outcome != 'success' || steps.check.outcome != 'success' || steps.deploy.outcome != 'success')
        run: exit 1

# Registered workflow revision.
