name: One-shot refresh registered implementation

on:
  push:
    branches:
      - feature/h2-htl-survival-table

permissions:
  contents: write

jobs:
  refresh-certified-implementation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/h2-htl-survival-table
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh checksum-verified registered implementation archive
        run: node scripts/one-shot-refresh-registered-implementation.mjs
      - name: Remove one-shot machinery and commit certified archive
        shell: bash
        run: |
          rm scripts/one-shot-refresh-registered-implementation.mjs .github/workflows/one-shot-refresh-registered-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refresh certified Horizon implementation for H2"
          git push origin HEAD:feature/h2-htl-survival-table
