name: Import registered Horizon clean evidence

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: read
  contents: write

jobs:
  import:
    if: github.head_ref == 'repair/registered-horizon-analytical-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/registered-horizon-analytical-certification
          fetch-depth: 1
      - name: Download immutable certification evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/8914001768/zip > /tmp/registered-horizon-certification-evidence.zip
          echo '444a1226b70460d51d9c0a3e5c09f1de5f9f976878c4a62ab384b318f868281c  /tmp/registered-horizon-certification-evidence.zip' | sha256sum -c -
          mkdir -p /tmp/evidence test/fixtures
          unzip -q /tmp/registered-horizon-certification-evidence.zip -d /tmp/evidence
      - name: Verify aggregate evidence and create pair-scoped fixtures
        run: |
          node --input-type=module <<'NODE'
          import {readFile,copyFile,mkdir,rm,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {gunzipSync,gzipSync} from 'node:zlib';
          const hash=value=>createHash('sha256').update(value).digest('hex');
          const base='/tmp/evidence/';
          const manifest=JSON.parse(await readFile(base+'registered-horizon-clean-manifest.json','utf8'));
          const aggregateGzip=await readFile(base+'registered-horizon-clean-candles.json.gz');
          const aggregateRaw=gunzipSync(aggregateGzip);
          const performance=await readFile(base+'registered-horizon-clean-performance.json');
          if(hash(aggregateGzip)!==manifest.candleSnapshotGzipSha256)throw new Error('CLEAN_GZIP_HASH_MISMATCH');
          if(hash(aggregateRaw)!==manifest.candleSnapshotSha256)throw new Error('CLEAN_CANDLE_HASH_MISMATCH');
          if(hash(performance)!==manifest.cleanPerformanceSha256)throw new Error('CLEAN_PERFORMANCE_HASH_MISMATCH');
          const snapshot=JSON.parse(aggregateRaw.toString('utf8'));
          if(snapshot.pairs.length!==28)throw new Error(`CLEAN_PAIR_COUNT_MISMATCH:${snapshot.pairs.length}`);
          const directory='test/fixtures/registered-horizon-clean-candles';
          await rm(directory,{recursive:true,force:true});
          await mkdir(directory,{recursive:true});
          const pairIndex={
            format:'registered-horizon-clean-pair-index-v1',
            aggregateSnapshotSha256:manifest.candleSnapshotSha256,
            aggregateSnapshotGzipSha256:manifest.candleSnapshotGzipSha256,
            auditTo:manifest.auditTo,
            barsPerPair:manifest.barsPerPair,
            pairs:[]
          };
          for(const pair of snapshot.pairs){
            const candles=snapshot.candlesByPair[pair];
            if(!Array.isArray(candles)||candles.length!==manifest.barsPerPair)throw new Error(`${pair}:CANDLE_COUNT_MISMATCH`);
            const canonical=JSON.stringify(candles);
            const candleSha256=hash(canonical);
            if(candleSha256!==manifest.pairHashes[pair])throw new Error(`${pair}:PAIR_HASH_MISMATCH`);
            const gzip=gzipSync(Buffer.from(canonical,'utf8'),{level:9});
            const file=`${pair}.json.gz`;
            await writeFile(`${directory}/${file}`,gzip);
            pairIndex.pairs.push({
              pair,
              file,
              bars:candles.length,
              candleSha256,
              gzipSha256:hash(gzip),
              firstCandle:candles[0]?.time||null,
              lastCandle:candles.at(-1)?.time||null
            });
          }
          await writeFile('test/fixtures/registered-horizon-clean-pairs.json',`${JSON.stringify(pairIndex,null,2)}\n`,'utf8');
          await copyFile(base+'registered-horizon-clean-performance.json','test/fixtures/registered-horizon-clean-performance.json');
          await copyFile(base+'registered-horizon-clean-manifest.json','test/fixtures/registered-horizon-clean-manifest.json');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify every frozen pair and all 168 clean rows before commit
        run: |
          npm ci
          node --test test/registered-clean-snapshot.test.js
      - name: Commit authenticated pair-scoped evidence to certification branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f test/fixtures/registered-horizon-clean-candles/*.json.gz
          git add test/fixtures/registered-horizon-clean-pairs.json test/fixtures/registered-horizon-clean-performance.json test/fixtures/registered-horizon-clean-manifest.json
          git diff --cached --quiet || git commit -m 'certification: freeze clean 28-pair Horizon benchmark'
          git push origin HEAD:repair/registered-horizon-analytical-certification
