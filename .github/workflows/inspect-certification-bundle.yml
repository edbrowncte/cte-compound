name: Inspect certification bundle markers

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'repair/registered-horizon-analytical-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/registered-horizon-analytical-certification
          fetch-depth: 0
      - name: Restore prior verified implementation bundle
        run: |
          git checkout 72fb37efc081e35172e11af4b73d5ba52b144652 -- \
            source-code/registered-horizon-implementation.manifest.json \
            source-code/registered-horizon-implementation.gz.b64.part-00 \
            source-code/registered-horizon-implementation.gz.b64.part-01 \
            source-code/registered-horizon-implementation.gz.b64.part-02
          node scripts/hydrate-registered-horizon.mjs
      - name: Disclose exact patch boundaries
        run: |
          echo '--- ANALYTICAL_CERTIFICATION ---'
          sed -n '25,42p' src/horizon-platform-engine.js
          echo '--- ENGINE CERTIFICATION BLOCK ---'
          grep -n -E 'executionCertification|PENDING_|ANALYTICAL_CERTIFICATION_BLOCK' src/engine.js
          echo '--- CHECKER CERTIFICATION BLOCK ---'
          grep -n -E 'BLOCKED_|PENDING_' scripts/check-worker.mjs
