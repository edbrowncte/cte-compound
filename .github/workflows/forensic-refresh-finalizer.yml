name: Finalize forensic refresh boundaries

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'repair/forensic-refresh-boundaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/forensic-refresh-boundaries
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply proven refresh-boundary repair
        run: |
          rm -f scripts/forensic-refresh.trigger*
          if [ -f scripts/apply-forensic-refresh-repair.py ]; then
            python scripts/apply-forensic-refresh-repair.py
          fi
          sed -i 's/"refreshChart").addEventListener("click",()=>loadChart())"/"addEventListener(\\"click\\",()=>loadChart())"/' scripts/check-html.mjs
          sed -i 's/Object.defineProperty(window.HTMLElement.prototype,"clientHeight",{get(){return 420;}});/Object.defineProperty(window.HTMLElement.prototype,"clientHeight",{get(){return 420;}});Object.defineProperty(window.HTMLElement.prototype,"scrollIntoView",{value:()=>{}});/' scripts/test-browser.mjs
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Execute full source and DOM behavior checks
        run: npm run check
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Repair refresh request boundaries"
            git push origin HEAD:repair/forensic-refresh-boundaries
          fi
