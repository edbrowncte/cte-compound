name: Finalize unique candidate availability

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'repair/performance-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/performance-diagnostics
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply unique candidate availability repair
        run: python scripts/apply-candidate-availability.py
      - name: Execute complete repository checks
        run: npm run check
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce unique candidates and live position validation"
          git push origin HEAD:repair/performance-diagnostics
