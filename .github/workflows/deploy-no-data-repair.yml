name: Deploy no-data repair

on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-no-data-repair.yml]

permissions:
  contents: write

jobs:
  deploy:
    if: github.event.head_commit.message == 'deploy: publish no-data repair with receipt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - name: Deploy cte-compound
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Record successful deployment
        run: |
          printf '{"worker":"cte-compound","source":"%s","deployed_at":"%s"}\n' "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deployment-receipt.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-receipt.json
          git commit -m "deployment: cte-compound no-data repair published"
          git push origin HEAD:main
