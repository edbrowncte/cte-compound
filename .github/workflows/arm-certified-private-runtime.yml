name: Arm certified private runtime

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: arm-certified-private-runtime
  cancel-in-progress: true

jobs:
  arm:
    if: github.head_ref == 'repair/registered-horizon-analytical-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/registered-horizon-analytical-certification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Hydrate certified Horizon runtime
        run: node scripts/hydrate-registered-horizon.mjs
      - name: Arm private execution and repack checksum bundle
        run: node scripts/arm-certified-private-runtime.mjs
      - name: Verify armed runtime and all 168 certified rows
        run: |
          node scripts/hydrate-registered-horizon.mjs
          npm ci
          npm run check
      - name: Commit byte-exact armed runtime bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-code/registered-horizon-implementation.manifest.json \
            source-code/registered-horizon-implementation.gz.b64.part-00 \
            source-code/registered-horizon-implementation.gz.b64.part-01 \
            source-code/registered-horizon-implementation.gz.b64.part-02
          git diff --cached --quiet || git commit -m 'certification: arm certified private Horizon runtime'
          git push origin HEAD:repair/registered-horizon-analytical-certification
