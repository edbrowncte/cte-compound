name: Finalize chart count declaration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'repair/count-reference'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/count-reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply chart count declaration repair
        run: |
          if [ -f scripts/fix-count-reference.py ]; then
            python scripts/fix-count-reference.py
          fi
      - name: Execute complete repository checks
        run: npm run check
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Declare chart candle count locally"
            git push origin HEAD:repair/count-reference
          fi
