name: Finalize platform load shedding

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'repair/load-shedding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/load-shedding
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply foreground-first load shedding
        run: |
          if [ -f scripts/apply-load-shedding.py ]; then
            python scripts/apply-load-shedding.py
          fi
      - name: Execute complete repository checks
        run: npm run check
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Prioritize selected chart and shed background load"
            git push origin HEAD:repair/load-shedding
          fi
