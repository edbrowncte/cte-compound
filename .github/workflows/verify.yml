name: Verify analytical compound

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/access-age-finalization
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply Access and AGE finalization migration
        run: |
          if grep -q 'requireCloudflareAccess(request,env)' src/worker-base.js; then
            echo "Runtime migration already applied."
          else
            node scripts/migrate-access-age-finalization.mjs
            node scripts/migrate-access-age-finalization-fixups.mjs
          fi
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler Types
        run: npx wrangler types
      - name: Run Biome Lint & Format Check
        run: npm run lint
      - name: Run TypeScript Type Check
        run: npm run typecheck
      - name: Verify Worker and standalone HTML
        run: npm run check
      - name: Commit migrated runtime
        run: |
          if git diff --quiet src/worker-base.js src/engine-certified-execution.js src/engine-nemotron-base.js src/age-expectation.js public/index.html; then
            echo "No runtime migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker-base.js src/engine-certified-execution.js src/engine-nemotron-base.js src/age-expectation.js public/index.html
          git commit -m "feat: enforce private Access and finalize AGE capital reallocation"
          git push origin HEAD:feature/access-age-finalization
