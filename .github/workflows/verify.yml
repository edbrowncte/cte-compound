name: Verify analytical compound

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply proactive mentor integration on feature branch
        if: github.head_ref == 'feature/proactive-market-mentor'
        run: |
          node scripts/apply-proactive-mentor.mjs
          if ! git diff --quiet -- public/index.html public/mas-im-calculator.js test/mas-im-calculator.test.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/index.html public/mas-im-calculator.js test/mas-im-calculator.test.js
            git commit -m "feat: wire proactive market mentor and aligned transition semantics"
            git push origin HEAD:feature/proactive-market-mentor
          fi
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler Types
        run: npx wrangler types
      - name: Run Biome Lint & Format Check
        run: npm run lint
      - name: Run TypeScript Type Check
        run: npm run typecheck
      - name: Verify Worker and standalone HTML
        run: npm run check
