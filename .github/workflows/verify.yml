name: Verify analytical compound

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/platform-composition-indicator-model-upgrade
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply platform composition upgrade
        run: |
          node scripts/fix-platform-migration-syntax.mjs
          node scripts/migrate-platform-composition-indicator-model.mjs
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler Types
        run: npx wrangler types
      - name: Run Biome Lint & Format Check
        run: npm run lint
      - name: Run TypeScript Type Check
        run: npm run typecheck
      - name: Verify Worker and standalone HTML
        run: npm run check
      - name: Commit materialized upgrade
        run: |
          if git diff --quiet public/index.html public/market-mentor.js src/horizon-platform-engine.js src/optimized-optimizer.js src/engine-certified-execution.js src/engine-nemotron-base.js scripts/test-nemotron.mjs scripts/test-platform-composition-upgrade.mjs package.json scripts/migrate-platform-composition-indicator-model.mjs; then
            echo "No migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/market-mentor.js src/horizon-platform-engine.js src/optimized-optimizer.js src/engine-certified-execution.js src/engine-nemotron-base.js scripts/test-nemotron.mjs scripts/test-platform-composition-upgrade.mjs package.json scripts/migrate-platform-composition-indicator-model.mjs
          git commit -m "feat: compose capitalization model and persistent indicators"
          git push origin HEAD:feature/platform-composition-indicator-model-upgrade
