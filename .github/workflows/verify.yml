name: Verify analytical compound

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: repair/forensic-oanda-connect-recovery
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply forensic connection recovery migration
        run: node scripts/migrate-forensic-connect-recovery.mjs
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler Types
        run: npx wrangler types
      - name: Run Biome Lint & Format Check
        run: npm run lint
      - name: Run TypeScript Type Check
        run: npm run typecheck
      - name: Verify Worker and standalone HTML
        run: npm run check
      - name: Commit recovered runtime
        run: |
          if git diff --quiet src/worker-base.js public/index.html; then
            echo "No forensic migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker-base.js public/index.html
          git commit -m "fix: recover staged OANDA connection diagnostics"
          git push origin HEAD:repair/forensic-oanda-connect-recovery
