name: Verify analytical compound

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: repair/optimizer-shards-event-ledger
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply optimizer shard and event ledger migration
        run: |
          if grep -q 'RUNTIME_OPTIMIZER_STORAGE_PREFIX' src/optimized-optimizer.js; then
            echo "Migration already applied."
          else
            node scripts/migrate-optimizer-shards-event-ledger.mjs
          fi
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler Types
        run: npx wrangler types
      - name: Run Biome Lint & Format Check
        run: npm run lint
      - name: Run TypeScript Type Check
        run: npm run typecheck
      - name: Verify Worker and standalone HTML
        run: npm run check
      - name: Commit repaired runtime
        run: |
          if git diff --quiet src/optimized-optimizer.js src/engine-certified-execution.js public/index.html; then
            echo "No runtime migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/optimized-optimizer.js src/engine-certified-execution.js public/index.html
          git commit -m "fix: shard optimizer storage and populate event outcomes"
          git push origin HEAD:repair/optimizer-shards-event-ledger
