name: Verify analytical compound

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply status observability migration on repair branch
        if: github.head_ref == 'repair/open-position-and-nemotron-status-observability'
        run: |
          node scripts/apply-status-observability-patch.mjs
          if ! git diff --quiet -- src/engine-certified-execution.js src/worker-base.js public/index.html scripts/test-runtime-base.mjs scripts/test-browser.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/engine-certified-execution.js src/worker-base.js public/index.html scripts/test-runtime-base.mjs scripts/test-browser.mjs
            git commit -m "fix: make open-position and Nemotron status observability live"
            git push origin HEAD:repair/open-position-and-nemotron-status-observability
          fi
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler Types
        run: npx wrangler types
      - name: Run Biome Lint & Format Check
        run: npm run lint
      - name: Run TypeScript Type Check
        run: npm run typecheck
      - name: Verify Worker and standalone HTML
        run: npm run check
