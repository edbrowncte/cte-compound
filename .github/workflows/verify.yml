name: Verify analytical compound

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: repair/htl-schedule-max-history
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply HTL schedule maximum-history migration
        run: node scripts/migrate-htl-schedule-max-history.mjs
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler Types
        run: npx wrangler types
      - name: Run Biome Lint & Format Check
        run: npm run lint
      - name: Run TypeScript Type Check
        run: npm run typecheck
      - name: Verify Worker and standalone HTML
        run: npm run check
      - name: Commit materialized runtime
        run: |
          if git diff --quiet public/index.html; then
            echo "No migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "fix: load full HTL schedule event history"
          git pull --rebase origin repair/htl-schedule-max-history
          git push origin HEAD:repair/htl-schedule-max-history
