name: Verify analytical compound

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply MAS v2 UI migration on feature branch
        if: github.head_ref == 'feature/mas-antagonist-pressure-v2'
        run: |
          python3 scripts/apply-mas-v2-ui.py
          if ! git diff --quiet -- public/index.html public/mas-im-calculator.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/index.html public/mas-im-calculator.js
            git commit -m "feat: wire MAS antagonist pressure v2 Evaluation facility"
            git push origin HEAD:feature/mas-antagonist-pressure-v2
          fi
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler Types
        run: npx wrangler types
      - name: Run Biome Lint & Format Check
        run: npm run lint
      - name: Run TypeScript Type Check
        run: npm run typecheck
      - name: Verify Worker and standalone HTML
        run: npm run check
