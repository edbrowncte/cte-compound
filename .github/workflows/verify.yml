name: Verify analytical compound

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: repair/production-auto-session-mt4-block
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply production auto-session migration
        run: |
          node scripts/migrate-production-auto-session.mjs
          node scripts/migrate-production-session-cleanup.mjs
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler Types
        run: npx wrangler types
      - name: Run Biome Lint & Format Check
        run: npm run lint
      - name: Run TypeScript Type Check
        run: npm run typecheck
      - name: Verify Worker and standalone HTML
        run: npm run check
      - name: Commit migrated runtime
        run: |
          if git diff --quiet src/worker-base.js public/index.html scripts/test-browser.mjs scripts/test-runtime-base.mjs scripts/test-forensic-connect-recovery.mjs scripts/check-html.mjs; then
            echo "No migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker-base.js public/index.html scripts/test-browser.mjs scripts/test-runtime-base.mjs scripts/test-forensic-connect-recovery.mjs scripts/check-html.mjs
          git commit -m "fix: auto-start live session and exclude MT4 account"
          git push origin HEAD:repair/production-auto-session-mt4-block
