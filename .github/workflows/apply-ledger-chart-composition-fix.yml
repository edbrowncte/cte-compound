name: Apply ledger and chart composition repair
on:
  push:
    branches:
      - fix/event-ledger-chart-control-composition
    paths:
      - scripts/apply-ledger-chart-composition-fix.mjs
      - .github/workflows/apply-ledger-chart-composition-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/event-ledger-chart-control-composition
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply fail-closed composition repair
        run: node scripts/apply-ledger-chart-composition-fix.mjs
      - name: Focused certification
        run: |
          node --check public/analytical-facilities.js
          node --check public/indicator-only.js
          node scripts/test-analytical-facilities.mjs
          node scripts/test-indicator-only.mjs
          node scripts/test-independent-chart-controls.mjs
      - name: Remove one-shot machinery
        run: rm scripts/apply-ledger-chart-composition-fix.mjs .github/workflows/apply-ledger-chart-composition-fix.yml
      - name: Commit repair
        run: |
          git config user.name edbrowncte
          git config user.email thetestamony@gmail.com
          git add -A
          git commit -m "Repair Event Outcome Ledger and chart control composition"
          git push origin HEAD:fix/event-ledger-chart-control-composition
