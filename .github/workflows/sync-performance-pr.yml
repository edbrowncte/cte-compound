name: Synchronize performance repair PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'repair/performance-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/performance-diagnostics
          fetch-depth: 0
      - name: Merge current main and remove trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm -f scripts/sync-performance-trigger
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Synchronize repair with main"; fi
          git push origin HEAD:repair/performance-diagnostics
