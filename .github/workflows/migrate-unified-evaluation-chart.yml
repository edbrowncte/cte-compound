name: Materialize unified evaluation chart

on:
  push:
    branches:
      - feature/unified-evaluation-chart

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/unified-evaluation-chart
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply unified chart migration
        run: node scripts/migrate-unified-evaluation-chart.mjs
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler types
        run: npx wrangler types
      - name: Verify repository
        run: npm run check
      - name: Commit materialized chart runtime
        run: |
          if git diff --quiet public/index.html; then
            echo "No chart migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "feat: use one evaluation chart across all chart facilities"
          git push origin HEAD:feature/unified-evaluation-chart
