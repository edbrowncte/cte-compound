name: Finalize platform Horizon migration
on:
  push:
    branches: [feature/platform-horizon-crossing]
    paths:
      - scripts/apply-platform-horizon.mjs
      - public/htl-horizon-contract.js
      - .github/workflows/finalize-platform-horizon.yml
jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/platform-horizon-crossing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply and verify
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p tmp
          node scripts/apply-platform-horizon.mjs > tmp/platform-migration.log 2>&1
          transform_status=$?
          if [ "$transform_status" -eq 0 ]; then
            npm run check >> tmp/platform-migration.log 2>&1
            check_status=$?
          else
            check_status=99
          fi
          echo "transform_status=$transform_status" >> tmp/platform-migration.log
          echo "check_status=$check_status" >> tmp/platform-migration.log
          cat tmp/platform-migration.log
          if [ "$transform_status" -eq 0 ] && [ "$check_status" -eq 0 ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit verified migration or diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/platform-migration.log
          if [ "${{ steps.verify.outputs.verified }}" = "true" ]; then
            git add public/index.html public/htl-horizon-contract.js src/engine.js src/worker.js package.json package-lock.json scripts/test-horizon-contract.mjs
            message="Implement platform-wide Horizon crossing contract"
          else
            message="ci: capture Horizon migration failure"
          fi
          git diff --cached --quiet || git commit -m "$message"
          git push origin HEAD:feature/platform-horizon-crossing
