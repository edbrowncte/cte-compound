name: Migrate maximum history causal indicators

on:
  push:
    branches:
      - repair/max-history-causal-indicators

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: repair/max-history-causal-indicators
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply maximum-history causal-indicator migration
        run: node scripts/migrate-max-history-causal-indicators.mjs
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler types
        run: npx wrangler types
      - name: Verify repository
        run: npm run check
      - name: Commit migrated runtime
        run: |
          if git diff --quiet public/index.html src/worker-base.js; then
            echo "No migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html src/worker-base.js
          git commit -m "fix: load maximum analytical history and causal indicators"
          git push origin HEAD:repair/max-history-causal-indicators
