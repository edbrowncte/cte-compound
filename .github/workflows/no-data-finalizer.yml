name: Finalize no-data orchestration repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'repair/no-data-orchestration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/no-data-orchestration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic no-data repair
        run: python scripts/apply-no-data-repair.py
      - name: Execute complete repository checks
        run: npm run check
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair candle orchestration and no-data stalls"
          git push origin HEAD:repair/no-data-orchestration

# Registered workflow revision.
