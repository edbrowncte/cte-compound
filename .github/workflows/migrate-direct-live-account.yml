name: Migrate direct live account binding

on:
  push:
    branches:
      - repair/block-mt4-use-configured-live-account

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: repair/block-mt4-use-configured-live-account
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply migration
        run: node scripts/migrate-direct-live-account.mjs
      - name: Install dependencies
        run: npm ci
      - name: Generate Wrangler types
        run: npx wrangler types
      - name: Verify repository
        run: npm run check
      - name: Commit migrated runtime
        run: |
          if git diff --quiet src/worker-base.js public/index.html; then
            echo "No migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker-base.js public/index.html
          git commit -m "fix: bind CTE Compound directly to configured live account"
          git push origin HEAD:repair/block-mt4-use-configured-live-account
