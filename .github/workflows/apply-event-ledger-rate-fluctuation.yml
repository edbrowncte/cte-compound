name: Apply event ledger and rate fluctuation facility

on:
  push:
    branches:
      - feature/event-ledger-pair-rate-fluctuation
    paths:
      - scripts/apply-event-ledger-rate-fluctuation.mjs
      - .github/workflows/apply-event-ledger-rate-fluctuation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/event-ledger-pair-rate-fluctuation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply fail-closed facility patch
        run: node scripts/apply-event-ledger-rate-fluctuation.mjs
      - name: Syntax and focused certification
        run: |
          node --check public/analytical-facilities.js
          node scripts/test-analytical-facilities.mjs
      - name: Remove one-shot machinery
        run: rm scripts/apply-event-ledger-rate-fluctuation.mjs .github/workflows/apply-event-ledger-rate-fluctuation.yml
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/analytical-facilities.js scripts/test-analytical-facilities.mjs scripts/apply-event-ledger-rate-fluctuation.mjs .github/workflows/apply-event-ledger-rate-fluctuation.yml
          git commit -m 'Add Event Ledger pair filter and rate fluctuation ranking'
          git push origin HEAD:feature/event-ledger-pair-rate-fluctuation
