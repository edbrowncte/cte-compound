name: Apply rate fluctuation corroboration repair
on:
  push:
    branches:
      - fix/rate-fluctuation-final-event-corroboration-actual
    paths:
      - scripts/apply-rate-fluctuation-corroboration-fix.py
      - .github/workflows/apply-rate-fluctuation-corroboration-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rate-fluctuation-final-event-corroboration-actual
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply fail-closed corroboration repair
        run: python3 scripts/apply-rate-fluctuation-corroboration-fix.py
      - name: Focused certification
        run: |
          node --check public/analytical-facilities.js
          node scripts/test-analytical-facilities.mjs
      - name: Remove one-shot machinery
        run: rm scripts/apply-rate-fluctuation-corroboration-fix.py .github/workflows/apply-rate-fluctuation-corroboration-fix.yml
      - name: Commit repair
        run: |
          git config user.name edbrowncte
          git config user.email thetestamony@gmail.com
          git add -A
          git commit -m "Repair Rate Fluctuation FINAL-event corroboration"
          git push origin HEAD:fix/rate-fluctuation-final-event-corroboration-actual
