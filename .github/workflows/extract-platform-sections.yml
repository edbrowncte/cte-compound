name: Extract platform sections
on:
  push:
    branches: [feature/platform-horizon-crossing]
    paths:
      - scripts/extract-platform-sections.mjs
      - .github/workflows/extract-platform-sections.yml
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/platform-horizon-crossing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/extract-platform-sections.mjs
      - name: Commit excerpts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/platform-sections.txt
          git diff --cached --quiet || git commit -m "chore: capture platform source excerpts"
          git push origin HEAD:feature/platform-horizon-crossing
