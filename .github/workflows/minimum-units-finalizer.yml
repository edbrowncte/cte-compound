name: Finalize minimum units control

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'repair/minimum-units'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/minimum-units
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimum units control
        run: |
          if [ -f scripts/apply-minimum-units.py ]; then
            python scripts/apply-minimum-units.py
          fi
      - name: Execute complete repository checks
        run: npm run check
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add persistent 1000-unit minimum control"
            git push origin HEAD:repair/minimum-units
          fi
