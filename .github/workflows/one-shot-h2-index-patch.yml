name: One-shot H2 browser source patch

on:
  push:
    branches:
      - feature/h2-htl-survival-table

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/h2-htl-survival-table
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch frozen browser timeframe registry
        run: node scripts/one-shot-h2-index-patch.mjs
      - name: Remove one-shot machinery and commit source result
        shell: bash
        run: |
          rm scripts/one-shot-h2-index-patch.mjs .github/workflows/one-shot-h2-index-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add H2 to browser timeframe surfaces"
          git push origin HEAD:feature/h2-htl-survival-table
