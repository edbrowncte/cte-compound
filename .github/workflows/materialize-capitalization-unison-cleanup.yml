name: Materialize capitalization unison cleanup

on:
  push:
    branches:
      - feature/capitalization-model-control-unison

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/capitalization-model-control-unison
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Normalize strategy identifier
        run: node scripts/fix-capitalization-control-unison.mjs
      - name: Commit cleanup
        run: |
          if git diff --quiet src/engine-certified-execution.js; then
            echo "No cleanup diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine-certified-execution.js
          git commit -m "fix: preserve DARE(N) control identity in model context"
          git push origin HEAD:feature/capitalization-model-control-unison
