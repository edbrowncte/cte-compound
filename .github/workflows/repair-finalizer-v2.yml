name: Execute approved runtime finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'repair/asset-optimized-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/asset-optimized-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic final transformation
        run: python scripts/finalize-runtime-repair.py
      - name: Execute complete repository checks
        run: npm run check
      - name: Commit verified final source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve optimized reconciliation and cancel stale chart work"
          git push origin HEAD:repair/asset-optimized-runtime

# Registered finalizer revision.
