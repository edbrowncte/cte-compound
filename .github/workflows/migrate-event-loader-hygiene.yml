name: Migrate HTL event loader hygiene

on:
  push:
    branches:
      - fix/htl-event-loader-cache-hygiene

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/htl-event-loader-cache-hygiene
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply loader hygiene migration
        run: node scripts/migrate-event-loader-hygiene.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify repository
        run: npm run check
      - name: Commit migrated source
        run: |
          if git diff --quiet public/index.html; then
            echo "No migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "fix: harden HTL event loading and cache hygiene"
          git push origin HEAD:fix/htl-event-loader-cache-hygiene
